[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "safety-gymnasium2-building-scenery"
version = "1.0.0"
description = "Building scenery assets for Safety Gymnasium 2."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]

[tool.setuptools]
include-package-data = false
packages = ["safety_gymnasium2_building_scenery"]

[tool.setuptools.package-data]
safety_gymnasium2_building_scenery = ["meshes/*", "textures/*"]
