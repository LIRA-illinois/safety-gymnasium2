default_stages: [pre-commit, manual]
exclude: ^legacy/
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-symlinks
      - id: destroyed-symlinks
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        exclude: ^(docs/_static/images/|asset_packs/|safety_gymnasium2/assets/(meshes|textures)/)
      - id: check-merge-conflict
        exclude: \.rst$
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: detect-private-key
  - repo: local
    hooks:
      - id: python-checks
        name: Locked Ruff and ty checks
        entry: make commit-checks
        language: system
        pass_filenames: false
        files: '(\.pyi?$|(^|/)pyproject\.toml$|^uv\.lock$|^Makefile$)'
