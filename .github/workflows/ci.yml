# Modified for Safety Gymnasium 2.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  project-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.11"
      - name: Validate the lock and Python code
        run: |
          uv lock --check
          make commit-checks
      - name: Build documentation and validate citation metadata
        run: |
          make docs-build
          uvx cffconvert --validate

  package-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MUJOCO_GL: osmesa
      PYOPENGL_PLATFORM: osmesa
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.11"
      - name: Install headless rendering libraries
        run: |
          sudo apt-get update
          sudo apt-get install --yes libosmesa6
      - name: Build and inspect the distributions
        run: |
          make build
          uv run --no-project python tests/smoke_install.py archives
      - name: Smoke-test independent pip installs
        run: |
          wheelhouse="$GITHUB_WORKSPACE/dist"
          smoke="$GITHUB_WORKSPACE/tests/smoke_install.py"
          core_wheel=$(find "$wheelhouse" -maxdepth 1 -name 'safety_gymnasium2-*.whl')
          core_source=$(find "$wheelhouse" -maxdepth 1 -name 'safety_gymnasium2-*.tar.gz')
          cd "$RUNNER_TEMP"

          for artifact in "$core_wheel" "$core_source"; do
            install_dir=$(mktemp -d)
            uv venv --seed "$install_dir"
            "$install_dir/bin/python" -m pip install "$artifact"
            "$install_dir/bin/python" -m pip check
            "$install_dir/bin/python" -I "$smoke" core
          done
