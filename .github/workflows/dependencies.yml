name: fresh dependencies

on:
  schedule:
    - cron: '23 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  latest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MUJOCO_GL: osmesa
      PYOPENGL_PLATFORM: osmesa
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.14"
      - name: Install headless rendering libraries
        run: |
          sudo apt-get update
          sudo apt-get install --yes libosmesa6
      - name: Resolve and test current dependencies
        run: |
          uv lock --upgrade
          make test
      - name: Record dependency versions
        if: always()
        run: |
          {
            echo '## Installed Python packages'
            echo '```'
            if test -x .venv/bin/python; then
              uv pip list --python .venv/bin/python --format freeze
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
