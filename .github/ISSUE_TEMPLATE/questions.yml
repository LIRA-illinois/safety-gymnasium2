# Modified for Safety Gymnasium 2.
name: 🤔 Questions / Help / Support
description: Do you need support?
title: "[Question] "
labels: [question]
body:
  - type: checkboxes
    id: steps
    attributes:
      label: Required prerequisites
      description: Make sure you've completed the following steps before submitting your issue -- thank you!
      options:
        - label: I have read the [documentation](https://tran.aerospace.illinois.edu/safety-gymnasium2/).
          required: true
        - label: I have searched the [fork issue tracker](https://github.com/LIRA-illinois/safety-gymnasium2/issues) for an existing report.
          required: true

  - type: textarea
    id: questions
    attributes:
      label: Questions
      description: Describe your questions with relevant resources such as snippets, links, images, etc.
    validations:
      required: true
