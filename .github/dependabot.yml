# Modified for Safety Gymnasium 2.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    labels: [dependencies]
    commit-message:
      prefix: "deps(workflows)"
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies]
    groups:
      simulation:
        patterns: [gymnasium, gymnasium-robotics, mujoco, 'mujoco-*', numpy]
