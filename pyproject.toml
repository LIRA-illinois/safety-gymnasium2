[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "safety-gymnasium2"
description = "MuJoCo environments for safe reinforcement learning."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Safety-Gymnasium Contributors" }]
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["Safe Reinforcement Learning", "RL Environment", "MuJoCo"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "glfw>=2.6.2",
    "gymnasium>=1.2.0",
    "gymnasium-robotics>=1.4.2",
    "imageio>=2.27.0",
    "mujoco>=4.0.1",
    "numpy>=1.26.4",
    "pygame-ce>=2.5",
    "pyyaml>=6.0.1",
    "xmltodict>=1.0.1",
]
dynamic = ["version"]

[project.urls]
Repository = "https://github.com/LIRA-illinois/safety-gymnasium2"
Issues = "https://github.com/LIRA-illinois/safety-gymnasium2/issues"

[project.optional-dependencies]
racing = ["safety-gymnasium2-racing-assets>=1.0,<2"]
building = [
    "safety-gymnasium2-building-scenery>=1.0,<2",
    "safety-gymnasium2-building-structure>=1.0,<2",
]

[dependency-groups]
test = ["pytest", "pytest-cov", "pytest-xdist"]
lint = [
    "black[jupyter]>=23.1",
    "doc8",
    "flake8",
    "flake8-bugbear",
    "flake8-comprehensions",
    "flake8-docstrings",
    "flake8-pyi",
    "flake8-simplify",
    "isort>=5.11",
    "mypy>=0.990",
    "pre-commit",
    "pydocstyle[toml]",
    "pyenchant",
    "pylint[spelling]>=2.15",
    "ruff",
    "ty",
]
docs = [
    "furo",
    "moviepy",
    "myst-parser",
    "pyenchant",
    "sphinx",
    "sphinx-autobuild",
    "sphinx-autodoc-typehints",
    "sphinx-copybutton",
    "sphinx-design",
    "sphinx-github-changelog",
    "sphinxcontrib-spelling",
]

[tool.uv.workspace]
members = ["asset_packs/*"]

[tool.uv.sources]
safety-gymnasium2-racing-assets = { workspace = true }
safety-gymnasium2-building-scenery = { workspace = true }
safety-gymnasium2-building-structure = { workspace = true }

[tool.setuptools]
include-package-data = false

[tool.setuptools.dynamic]
version = { attr = "safety_gymnasium2.version.__version__" }

[tool.setuptools.packages.find]
include = ["safety_gymnasium2", "safety_gymnasium2.*"]

[tool.setuptools.package-data]
safety_gymnasium2 = [
    "assets/meshes/*",
    "assets/textures/*",
    "assets/xmls/*.xml",
    "configs/*.yaml",
    "tasks/safe_multi_agent/assets/xmls/*.xml",
    "tasks/safe_multi_agent/configs/*.yaml",
]

# Linter tools #################################################################

[tool.black]
safe = true
line-length = 100
skip-string-normalization = true
# Sync with requires-python
target-version = ["py311"]

[tool.isort]
atomic = true
profile = "black"
src_paths = ["safety_gymnasium2", "examples", "tests"]
extra_standard_library = ["typing_extensions"]
indent = 4
line_length = 100
lines_after_imports = 2
multi_line_output = 3

[tool.mypy]
python_version = "3.11"
pretty = true
show_error_codes = true
show_error_context = true
show_traceback = true
allow_redefinition = true
check_untyped_defs = true
disallow_incomplete_defs = false
disallow_untyped_defs = false
ignore_missing_imports = true
no_implicit_optional = true
strict_equality = true
strict_optional = true
warn_no_return = true
warn_redundant_casts = true
warn_unreachable = true
warn_unused_configs = true
warn_unused_ignores = true

[tool.pydocstyle]
convention = "google"

[tool.doc8]
max-line-length = 500

[tool.codespell]
ignore-words = "docs/spelling_wordlist.txt"

[tool.ruff]
# Sync with requires-python
target-version = "py311"
line-length = 100
src = ["safety_gymnasium2", "tests", "examples"]

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "UP",      # pyupgrade
    "ANN",     # flake8-annotations
    "S",       # flake8-bandit
    "BLE",     # flake8-blind-except
    "B",       # flake8-bugbear
    "COM",     # flake8-commas
    "C4",      # flake8-comprehensions
    "EXE",     # flake8-executable
    "ISC",     # flake8-implicit-str-concat
    "PIE",     # flake8-pie
    "PYI",     # flake8-pyi
    "Q",       # flake8-quotes
    "RSE",     # flake8-raise
    "RET",     # flake8-return
    "SIM",     # flake8-simplify
    "TID",     # flake8-tidy-imports
    "RUF",     # ruff
]
ignore = [
    # E501: line too long
    # W505: doc line too long
    # too long docstring due to long example blocks
    "E501",
    "W505",
    # TODO: Remove this five ignores
    # ANN001: missing type annotation for function argument
    # ANN002: missing type annotation for `*args`
    # ANN003: missing type annotation for `**kwargs`
    # ANN201: missing return type annotation for public function
    # ANN202: missing return type annotation for private function
    "ANN001","ANN002","ANN003","ANN201","ANN202",
    # ANN401: dynamically typed expressions (typing.Any) are disallowed
    "ANN401",
    # S101: use of `assert` detected
    # internal use and may never raise at runtime
    "S101",
    # PLR0402: use from {module} import {name} in lieu of alias
    # use alias for import convention (e.g., `import torch.nn as nn`)
    "PLR0402",
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = [
    "F401",  # unused-import
]
"tests/**/*.py" = [
    "ANN",   # flake8-annotations
    "S",     # flake8-bandit
    "BLE",   # flake8-blind-except
]

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = true

[tool.ruff.lint.flake8-quotes]
docstring-quotes = "double"
multiline-quotes = "double"
inline-quotes = "single"

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"
